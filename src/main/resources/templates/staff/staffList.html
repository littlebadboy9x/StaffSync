<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: html(~{::title}, ~{::section}, ~{::scripts})}">
<head>
    <title>Danh sách nhân viên</title>
</head>
<body>
<section>
    <div class="page-heading">
        <div class="page-title">
            <div class="row">
                <div class="col-12 col-md-6 order-md-1 order-last">
                    <h3>Danh sách nhân viên</h3>
                </div>
                <div class="col-12 col-md-6 order-md-2 order-first">
                    <div class="float-start float-lg-end">
                        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal">
                            <i class="bi bi-plus"></i> Thêm nhân viên
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <section class="section">
        <!-- Flash Messages -->
        <div th:if="${message}" class="alert alert-success" role="alert">
            <span th:text="${message}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <span th:text="${error}"></span>
        </div>

        <!-- Add Modal -->
        <div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addModalLabel">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="addModalLabel">Thêm nhân viên mới</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="addStaffForm" th:action="@{/staff}" method="post">
                            <input type="hidden" name="status" value="true">
                            <div class="mb-3">
                                <label for="addCode" class="form-label">Mã nhân viên</label>
                                <input type="text" class="form-control" id="addCode" name="code" required>
                            </div>
                            <div class="mb-3">
                                <label for="addName" class="form-label">Tên nhân viên</label>
                                <input type="text" class="form-control" id="addName" name="name" required>
                            </div>
                            <div class="mb-3">
                                <label for="addFptEmail" class="form-label">Email FPT</label>
                                <input type="email" class="form-control" id="addFptEmail" name="fptEmail" required>
                            </div>
                            <div class="mb-3">
                                <label for="addFeEmail" class="form-label">Email FE</label>
                                <input type="email" class="form-control" id="addFeEmail" name="feEmail" required>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                                <button type="submit" class="btn btn-primary">Thêm mới</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Edit Modal -->
        <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editModalLabel">Sửa thông tin nhân viên</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="editStaffForm" th:action="@{/staff/{id}(id=*{id})}" method="post">
                            <input type="hidden" name="_method" value="PUT">
                            <input type="hidden" id="editStaffId" name="id">
                            <input type="hidden" id="editStatus" name="status">
                            <div class="mb-3">
                                <label for="editCode" class="form-label">Mã nhân viên</label>
                                <input type="text" class="form-control" id="editCode" name="code" required>
                            </div>
                            <div class="mb-3">
                                <label for="editName" class="form-label">Tên nhân viên</label>
                                <input type="text" class="form-control" id="editName" name="name" required>
                            </div>
                            <div class="mb-3">
                                <label for="editFptEmail" class="form-label">Email FPT</label>
                                <input type="email" class="form-control" id="editFptEmail" name="fptEmail" required>
                            </div>
                            <div class="mb-3">
                                <label for="editFeEmail" class="form-label">Email FE</label>
                                <input type="email" class="form-control" id="editFeEmail" name="feEmail" required>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                                <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div th:if="${#lists.isEmpty(staffList)}"
                 class="d-flex flex-column justify-content-center align-items-center p-5">
                <img th:src="@{/images/no-data.png}" alt="No Data" style="max-width: 200px;">
                <p class="mt-3">Không có dữ liệu để hiển thị</p>
            </div>
            <div th:if="${!#lists.isEmpty(staffList)}" class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-hover table-sm" style="font-size: 0.9rem;">
                        <thead class="thead-light">
                        <tr>
                            <th style="width: 5%;">STT</th>
                            <th style="width: 10%;">Mã NV</th>
                            <th style="width: 20%;">Tên nhân viên</th>
                            <th style="width: 20%;">Email FPT</th>
                            <th style="width: 20%;">Email FE</th>
                            <th style="width: 10%;">Trạng thái</th>
                            <th style="width: 15%;">Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="staff, stat : ${staffList}">
                            <td th:text="${stat.count}">1</td>
                            <td th:text="${staff.code}">SE1234</td>
                            <td th:text="${staff.name}">Nguyễn Văn A</td>
                            <td th:text="${staff.fptEmail}">example@fpt.edu.vn</td>
                            <td th:text="${staff.feEmail}">example@fe.edu.vn</td>
                            <td>
                                <span th:if="${staff.status}" class="badge bg-success">Đang làm việc</span>
                                <span th:unless="${staff.status}" class="badge bg-danger">Đã nghỉ việc</span>
                            </td>
                            <td>
                                <a href="#" class="btn btn-sm btn-primary edit-btn" 
                                   th:data-staff-id="${staff.id}"
                                   th:data-staff-code="${staff.code}"
                                   th:data-staff-name="${staff.name}"
                                   th:data-staff-fpt-email="${staff.fptEmail}"
                                   th:data-staff-fe-email="${staff.feEmail}"
                                   th:data-staff-status="${staff.status}">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a th:href="@{/specialized-subjects/staff/{id}/specializations(id=${staff.id})}" class="btn btn-sm btn-info">
                                    <i class="bi bi-book"></i>
                                </a>
                                <form th:action="@{/staff/{id}/toggle-status(id=${staff.id})}" method="post" style="display: inline;">
                                    <input type="hidden" name="_method" value="PUT">
                                    <button type="submit" class="btn btn-sm toggle-status-btn" 
                                            th:classappend="${staff.status ? 'btn-danger' : 'btn-success'}"
                                            onclick="return confirm('Bạn có chắc chắn muốn thay đổi trạng thái nhân viên này?')">
                                        <i class="bi" th:classappend="${staff.status ? 'bi-toggle-on' : 'bi-toggle-off'}"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
</section>

<th:block th:fragment="scripts">
    <script th:inline="javascript">
        /*<![CDATA[*/
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize Bootstrap modal with proper configuration
            const editModal = new bootstrap.Modal(document.getElementById('editModal'), {
                keyboard: true,
                backdrop: 'static',
                focus: true
            });
            
            // Store the last focused element
            let lastFocusedElement = null;
            
            // Edit functionality
            document.querySelectorAll('.edit-btn').forEach(function(button) {
                button.addEventListener('click', function(e) {
                    e.preventDefault();
                    console.log('Edit button clicked');
                    
                    // Store the clicked button as last focused element
                    lastFocusedElement = this;
                    
                    const staffId = this.getAttribute('data-staff-id');
                    const staffCode = this.getAttribute('data-staff-code');
                    const staffName = this.getAttribute('data-staff-name');
                    const staffFptEmail = this.getAttribute('data-staff-fpt-email');
                    const staffFeEmail = this.getAttribute('data-staff-fe-email');
                    const staffStatus = this.getAttribute('data-staff-status');

                    console.log('Staff data:', {
                        id: staffId,
                        code: staffCode,
                        name: staffName,
                        fptEmail: staffFptEmail,
                        feEmail: staffFeEmail,
                        status: staffStatus
                    });

                    document.getElementById('editStaffId').value = staffId;
                    document.getElementById('editCode').value = staffCode;
                    document.getElementById('editName').value = staffName;
                    document.getElementById('editFptEmail').value = staffFptEmail;
                    document.getElementById('editFeEmail').value = staffFeEmail;
                    document.getElementById('editStatus').value = staffStatus;

                    // Update form action URL with the correct staff ID
                    const form = document.getElementById('editStaffForm');
                    form.action = `/staff/${staffId}`;

                    editModal.show();
                    
                    // Focus on first input after modal is shown
                    setTimeout(() => {
                        document.getElementById('editCode').focus();
                    }, 100);
                });
            });

            // Handle modal events
            const modalElement = document.getElementById('editModal');
            modalElement.addEventListener('shown.bs.modal', function () {
                document.getElementById('editCode').focus();
            });
            
            modalElement.addEventListener('hidden.bs.modal', function () {
                if (lastFocusedElement) {
                    lastFocusedElement.focus();
                }
            });
        });
        /*]]>*/
    </script>
</th:block>
</body>
</html>
