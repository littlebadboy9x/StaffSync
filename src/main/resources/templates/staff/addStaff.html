<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Staff</title>
</head>
<body>
<div layout:fragment="content">
    <h2>Add New Staff</h2>
    <form th:action="@{/staff}" th:object="${staffDTO}" method="post">
        <div>
            <label for="staffCode">Staff Code:</label>
            <input type="text" id="staffCode" th:field="*{staffCode}" required/>
        </div>
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" th:field="*{name}" required/>
        </div>
        <div>
            <label for="accountFpt">FPT Email:</label>
            <input type="email" id="accountFpt" th:field="*{accountFpt}" required/>
        </div>
        <div>
            <label for="accountFe">FE Email:</label>
            <input type="email" id="accountFe" th:field="*{accountFe}" required/>
        </div>
        <div>
            <label for="status">Status:</label>
            <select id="status" th:field="*{status}">
                <option value="1">Active</option>
                <option value="0">Inactive</option>
            </select>
        </div>
        <div>
            <button type="submit">Save</button>
        </div>
    </form>
</div>
</body>
</html>
