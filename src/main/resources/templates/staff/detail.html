<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Chi tiết nhân viên</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Chi tiết nhân viên</h2>

    <!-- Flash Messages -->
    <div th:if="${message}" class="alert alert-success" role="alert">
        <span th:text="${message}"></span>
    </div>
    <div th:if="${error}" class="alert alert-danger" role="alert">
        <span th:text="${error}"></span>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <p><strong>Mã nhân viên:</strong> <span th:text="${staff.code}"></span></p>
                    <p><strong>Tên nhân viên:</strong> <span th:text="${staff.name}"></span></p>
                    <p><strong>Email FPT:</strong> <span th:text="${staff.fptEmail}"></span></p>
                    <p><strong>Email FE:</strong> <span th:text="${staff.feEmail}"></span></p>
                </div>
                <div class="col-md-6">
                    <p><strong>Trạng thái:</strong> 
                        <span th:class="${staff.active ? 'badge badge-success' : 'badge badge-danger'}"
                              th:text="${staff.active ? 'Đang hoạt động' : 'Đã khóa'}">
                        </span>
                    </p>
                    <p><strong>Ngày tạo:</strong> <span th:text="${#temporals.format(staff.createdAt, 'dd/MM/yyyy HH:mm')}"></span></p>
                    <p><strong>Người tạo:</strong> <span th:text="${staff.createdBy}"></span></p>
                    <p><strong>Ngày cập nhật:</strong> <span th:text="${#temporals.format(staff.updatedAt, 'dd/MM/yyyy HH:mm')}"></span></p>
                    <p><strong>Người cập nhật:</strong> <span th:text="${staff.updatedBy}"></span></p>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/staff/{id}/edit(id=${staff.id})}" class="btn btn-primary">Chỉnh sửa</a>
        <a th:href="@{/staff/{id}/toggle-status(id=${staff.id})}" class="btn" 
           th:classappend="${staff.active ? 'btn-warning' : 'btn-success'}"
           th:text="${staff.active ? 'Khóa tài khoản' : 'Mở khóa tài khoản'}">
        </a>
        <a th:href="@{/staff}" class="btn btn-secondary">Quay lại</a>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
