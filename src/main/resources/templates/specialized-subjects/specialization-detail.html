<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Chi tiết chuyên ngành</title>
</head>
<body>
    <div class="content">
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">Thông tin chuyên ngành</h3>
                            <div class="card-tools">
                                <a th:href="@{/specialized-subjects}" class="btn btn-secondary btn-sm">
                                    <i class="fas fa-arrow-left"></i> Quay lại
                                </a>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label>Cơ sở:</label>
                                        <p th:text="${specialization.facilityName}"></p>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label>Bộ môn:</label>
                                        <p th:text="${specialization.departmentName}"></p>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label>Chuyên ngành:</label>
                                        <p th:text="${specialization.majorName}"></p>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label>Trạng thái:</label>
                                        <span th:if="${specialization.status == 1}" class="badge badge-success">Hoạt động</span>
                                        <span th:unless="${specialization.status == 1}" class="badge badge-danger">Không hoạt động</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">Danh sách nhân viên</h3>
                            <div class="card-tools">
                                <button type="button" class="btn btn-primary btn-sm" data-toggle="modal" data-target="#addStaffModal">
                                    <i class="fas fa-plus"></i> Thêm nhân viên
                                </button>
                            </div>
                        </div>
                        <div class="card-body">
                            <table class="table table-bordered">
                                <thead>
                                    <tr>
                                        <th>Mã nhân viên</th>
                                        <th>Họ tên</th>
                                        <th>Email FPT</th>
                                        <th>Email FE</th>
                                        <th>Ngày tạo</th>
                                        <th>Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="staff : ${staffList}">
                                        <td th:text="${staff.employeeCode}"></td>
                                        <td th:text="${staff.name}"></td>
                                        <td th:text="${staff.fptEmail}"></td>
                                        <td th:text="${staff.feEmail}"></td>
                                        <td th:text="${#dates.format(staff.createdDate, 'dd/MM/yyyy HH:mm')}"></td>
                                        <td>
                                            <button type="button" class="btn btn-danger btn-sm" 
                                                    th:onclick="'removeStaff(\'' + ${staff.id} + '\')'">
                                                <i class="fas fa-trash"></i> Xóa
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal thêm nhân viên -->
    <div class="modal fade" id="addStaffModal" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Thêm nhân viên</h5>
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="addStaffForm">
                        <div class="form-group">
                            <label>Nhân viên</label>
                            <select class="form-control" id="staffId" required>
                                <option value="">Chọn nhân viên</option>
                                <option th:each="staff : ${availableStaff}"
                                        th:value="${staff.id}"
                                        th:text="${staff.name + ' (' + staff.employeeCode + ')'}">
                                </option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Đóng</button>
                    <button type="button" class="btn btn-primary" onclick="addStaff()">Thêm</button>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        function addStaff() {
            const staffId = document.getElementById('staffId').value;
            if (!staffId) {
                alert('Vui lòng chọn nhân viên');
                return;
            }

            fetch('/specialized-subjects/' + /*[[${specialization.id}]]*/ + '/staff/' + staffId, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                    location.reload();
                } else {
                    response.text().then(text => alert(text));
                }
            })
            .catch(error => alert('Có lỗi xảy ra: ' + error));
        }

        function removeStaff(staffId) {
            if (!confirm('Bạn có chắc chắn muốn xóa nhân viên này?')) {
                return;
            }

            fetch('/specialized-subjects/' + /*[[${specialization.id}]]*/ + '/staff/' + staffId, {
                method: 'DELETE'
            })
            .then(response => {
                if (response.ok) {
                    location.reload();
                } else {
                    response.text().then(text => alert(text));
                }
            })
            .catch(error => alert('Có lỗi xảy ra: ' + error));
        }
    </script>
</body>
</html>
