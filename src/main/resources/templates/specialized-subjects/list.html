<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: html(~{::title}, ~{::section}, ~{})}">
<head>
    <title>Quản lý bộ môn chuyên ngành</title>
</head>
<body>
    <section>
        <!-- Flash messages -->
        <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Content -->
        <div class="page-heading">
            <div class="row">
                <div class="col-12 col-md-6 order-md-1 order-last">
                    <h3>Quản lý bộ môn chuyên ngành</h3>
                </div>
                <div class="col-12 col-md-6 order-md-2 order-first">
                    <div class="float-start float-lg-end">
                        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal">
                            <i class="bi bi-plus"></i> Thêm bộ môn chuyên ngành
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="page-content">
            <!-- Specializations Table -->
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Cơ sở</th>
                                    <th>Bộ môn</th>
                                    <th>Chuyên ngành</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="spec : ${specializations}">
                                    <td th:text="${spec.facilityName}"></td>
                                    <td th:text="${spec.departmentName}"></td>
                                    <td th:text="${spec.majorName}"></td>
                                    <td>
                                        <form th:action="@{/specialized-subjects/specialization/{id}(id=${spec.id})}" 
                                              method="post" 
                                              style="display: inline;"
                                              onsubmit="return confirm('Bạn có chắc chắn muốn xóa?');">
                                            <input type="hidden" name="_method" value="DELETE">
                                            <button type="submit" class="btn btn-danger btn-sm">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add Modal -->
        <div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="addModalLabel">Thêm bộ môn chuyên ngành</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form th:action="@{/specialized-subjects}" method="post">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="facilityId" class="form-label">Cơ sở</label>
                                <select class="form-select" id="facilityId" name="facilityId" required>
                                    <option value="">Chọn cơ sở</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="departmentId" class="form-label">Bộ môn</label>
                                <select class="form-select" id="departmentId" name="departmentId" required disabled>
                                    <option value="">Chọn bộ môn</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="majorId" class="form-label">Chuyên ngành</label>
                                <select class="form-select" id="majorId" name="majorId" required disabled>
                                    <option value="">Chọn chuyên ngành</option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                            <button type="submit" class="btn btn-primary">Thêm</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            const facilitySelect = document.getElementById('facilityId');
            const departmentSelect = document.getElementById('departmentId');
            const majorSelect = document.getElementById('majorId');

            // Load facilities
            fetch('/specialized-subjects/api/facilities')
                .then(response => response.json())
                .then(facilities => {
                    facilities.forEach(facility => {
                        const option = new Option(facility.name, facility.id);
                        facilitySelect.add(option);
                    });
                });

            // Handle facility selection
            facilitySelect.addEventListener('change', function() {
                departmentSelect.disabled = !this.value;
                departmentSelect.innerHTML = '<option value="">Chọn bộ môn</option>';
                majorSelect.disabled = true;
                majorSelect.innerHTML = '<option value="">Chọn chuyên ngành</option>';

                if (this.value) {
                    fetch(`/specialized-subjects/facilities/${this.value}/departments`)
                        .then(response => response.json())
                        .then(departments => {
                            departments.forEach(dept => {
                                const option = new Option(dept.department.name, dept.id);
                                departmentSelect.add(option);
                            });
                        });
                }
            });

            // Handle department selection
            departmentSelect.addEventListener('change', function() {
                majorSelect.disabled = !this.value;
                majorSelect.innerHTML = '<option value="">Chọn chuyên ngành</option>';

                if (this.value) {
                    fetch(`/specialized-subjects/department-facilities/${this.value}/majors`)
                        .then(response => response.json())
                        .then(majors => {
                            majors.forEach(major => {
                                const option = new Option(major.major.name, major.id);
                                majorSelect.add(option);
                            });
                        });
                }
            });
        });
    </script>
</body>
</html>
