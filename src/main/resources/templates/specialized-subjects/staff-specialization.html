<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: html(~{::title}, ~{::section}, ~{::scripts})}">
<head>
    <title>Quản lý bộ môn chuyên ngành</title>
</head>
<body>
<section>
    <div class="page-heading">
        <div class="page-title">
            <div class="row">
                <div class="col-12 col-md-6 order-md-1 order-last">
                    <h3>Quản lý bộ môn chuyên ngành</h3>
                </div>
            </div>
        </div>
    </div>

    <section class="section">
        <!-- Flash Messages -->
        <div th:if="${message}" class="alert alert-success" role="alert">
            <span th:text="${message}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <span th:text="${error}"></span>
        </div>

        <!-- Staff Information Card -->
        <div class="card">
            <div class="card-header">
                <h4 class="card-title">Thông tin nhân viên</h4>
                <div class="float-end">
                    <a th:href="@{/specialized-subjects/staff/{id}/download-template(id=${staff.id})}" class="btn btn-success">
                        <i class="bi bi-download"></i> Download Template
                    </a>
                </div>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <p><strong>Mã nhân viên:</strong> <span th:text="${staff.code}"></span></p>
                        <p><strong>Tên nhân viên:</strong> <span th:text="${staff.name}"></span></p>
                    </div>
                    <div class="col-md-6">
                        <p><strong>Email FPT:</strong> <span th:text="${staff.fptEmail}"></span></p>
                        <p><strong>Email FE:</strong> <span th:text="${staff.feEmail}"></span></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add Specialization Form -->
        <div class="card mt-4">
            <div class="card-header">
                <h4 class="card-title">Thêm bộ môn chuyên ngành</h4>
            </div>
            <div class="card-body">
                <form id="addSpecializationForm" method="post">
                    <div class="row">
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="facility">Cơ sở</label>
                                <select class="form-select" id="facility" name="facility" required>
                                    <option value="">Chọn cơ sở</option>
                                    <option th:each="facility : ${facilities}"
                                            th:value="${facility.id}"
                                            th:text="${facility.name}">
                                    </option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="department">Bộ môn</label>
                                <select class="form-select" id="department" name="department" required disabled>
                                    <option value="">Chọn bộ môn</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="major">Chuyên ngành</label>
                                <select class="form-select" id="major" name="major" required disabled>
                                    <option value="">Chọn chuyên ngành</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="mt-3">
                        <button type="button" class="btn btn-primary" onclick="addSpecialization()">Thêm</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Current Specializations -->
        <div class="card mt-4">
            <div class="card-header">
                <h4 class="card-title">Bộ môn chuyên ngành hiện tại</h4>
            </div>
            <div class="card-body">
                <div th:if="${#lists.isEmpty(specializations)}" class="text-center">
                    <p>Nhân viên chưa có bộ môn chuyên ngành nào</p>
                </div>
                <div th:unless="${#lists.isEmpty(specializations)}" class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                        <tr>
                            <th>Cơ sở</th>
                            <th>Bộ môn</th>
                            <th>Chuyên ngành</th>
                            <th>Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="spec : ${specializations}">
                            <td th:text="${spec.facilityName}"></td>
                            <td th:text="${spec.departmentName}"></td>
                            <td th:text="${spec.majorName}"></td>
                            <td>
                                <button type="button" class="btn btn-danger btn-sm" 
                                        th:data-id="${spec.id}"
                                        onclick="deleteSpecialization(this)">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
</section>

<th:block th:fragment="scripts">
    <script th:inline="javascript">
        /*<![CDATA[*/
        const staffId = /*[[${staff.id}]]*/ null;
        
        document.addEventListener('DOMContentLoaded', function() {
            const facilitySelect = document.getElementById('facility');
            const departmentSelect = document.getElementById('department');
            const majorSelect = document.getElementById('major');

            // Handle facility change
            facilitySelect.addEventListener('change', function() {
                const facilityId = this.value;
                departmentSelect.disabled = true;
                majorSelect.disabled = true;
                departmentSelect.innerHTML = '<option value="">Chọn bộ môn</option>';
                majorSelect.innerHTML = '<option value="">Chọn chuyên ngành</option>';

                if (facilityId) {
                    fetch(`/specialized-subjects/api/facilities/${facilityId}/departments`)
                        .then(response => {
                            if (!response.ok) {
                                return response.text().then(text => {
                                    throw new Error(text || 'Network response was not ok');
                                });
                            }
                            return response.json();
                        })
                        .then(departments => {
                            if (!Array.isArray(departments)) {
                                throw new Error('Invalid response format');
                            }
                            departmentSelect.disabled = false;
                            departments.forEach(dept => {
                                const option = document.createElement('option');
                                option.value = dept.id;
                                option.textContent = dept.departmentName;
                                departmentSelect.appendChild(option);
                            });
                        })
                        .catch(error => {
                            console.error('Error:', error);
                            alert('Có lỗi xảy ra khi tải danh sách bộ môn: ' + error.message);
                        });
                }
            });

            // Handle department change
            departmentSelect.addEventListener('change', function() {
                const departmentId = this.value;
                majorSelect.disabled = true;
                majorSelect.innerHTML = '<option value="">Chọn chuyên ngành</option>';

                if (departmentId) {
                    fetch(`/specialized-subjects/api/department-facilities/${departmentId}/majors`)
                        .then(response => {
                            if (!response.ok) {
                                return response.text().then(text => {
                                    throw new Error(text || 'Network response was not ok');
                                });
                            }
                            return response.json();
                        })
                        .then(majors => {
                            if (!Array.isArray(majors)) {
                                throw new Error('Invalid response format');
                            }
                            majorSelect.disabled = false;
                            majors.forEach(major => {
                                const option = document.createElement('option');
                                option.value = major.id;
                                option.textContent = major.majorName;
                                majorSelect.appendChild(option);
                            });
                        })
                        .catch(error => {
                            console.error('Error:', error);
                            alert('Có lỗi xảy ra khi tải danh sách chuyên ngành: ' + error.message);
                        });
                }
            });
        });

        function addSpecialization() {
            const majorId = document.getElementById('major').value;
            if (!majorId) {
                toastr.warning('Vui lòng chọn đầy đủ thông tin');
                return;
            }

            fetch(`/specialized-subjects/staff/${staffId}/major-facilities/${majorId}`, {
                method: 'POST'
            })
            .then(response => {
                if (response.ok) {
                    return response.json().then(data => {
                        toastr.success(data.message);
                        setTimeout(() => {
                            location.reload();
                        }, 1500);
                    });
                } else {
                    return response.json().then(data => {
                        toastr.error(data.message + ': ' + data.details);
                    });
                }
            })
            .catch(error => {
                console.error('Error:', error);
                toastr.error('Có lỗi xảy ra: ' + error.message);
            });
        }

        function deleteSpecialization(button) {
            const specializationId = button.getAttribute('data-id');
            if (!specializationId) {
                toastr.error('Không tìm thấy ID của chuyên ngành');
                return;
            }
            
            if (confirm('Bạn có chắc chắn muốn xóa bộ môn chuyên ngành này?')) {
                fetch(`/specialized-subjects/staff/${staffId}/major-facilities/${specializationId}`, {
                    method: 'DELETE'
                })
                .then(response => {
                    if (response.ok) {
                        toastr.success('Bộ môn chuyên ngành đã được xóa thành công');
                        setTimeout(() => {
                            location.reload();
                        }, 1500);
                    } else {
                        return response.json().then(data => {
                            toastr.error(data.message || 'Có lỗi xảy ra khi xóa bộ môn chuyên ngành');
                        });
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    toastr.error('Có lỗi xảy ra: ' + error.message);
                });
            }
        }
        /*]]>*/
    </script>
</th:block>
</body>
</html>
